<?xml version="1.0" encoding="UTF-8"?>
<!-- ELISEE SCOUT — Badge NON VERIFICATO (squadra fuori progetto)
     Stile: anello grigio vuoto + trattino (ben diverso dal verificato blu pieno) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Non verificato">
  <title>Non verificato</title>
  <!-- muted disc -->
  <circle cx="32" cy="32" r="26" fill="#3A3A3A"/>
  <!-- outer ring (lighter gray) -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#8A8A8A" stroke-width="3.2"/>
  <!-- dashed inner ring to reinforce "pending / not certified" -->
  <circle cx="32" cy="32" r="18.5" fill="none" stroke="#6B6B6B" stroke-width="2"
          stroke-dasharray="3.5 4.5" stroke-linecap="round"/>
  <!-- neutral mark: horizontal bar (NOT a check) -->
  <path d="M22 32 H42"
        fill="none"
        stroke="#B0B0B0"
        stroke-width="4.5"
        stroke-linecap="round"/>
</svg>
