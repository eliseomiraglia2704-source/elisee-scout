<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" width="200" height="56">
  <!-- Dark background -->
  <rect width="200" height="56" rx="10" fill="#0D2B6B"/>

  <!-- Yellow rounded square icon on left -->
  <rect x="10" y="9" width="38" height="38" rx="8" fill="#FFCD00"/>
  <!-- "ID" text inside yellow square -->
  <text x="29" y="34" dominant-baseline="middle" text-anchor="middle"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="18" fill="#003087">ID</text>

  <!-- PosteID label text -->
  <text x="60" y="27" font-family="'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="16" fill="#FFFFFF">Poste</text>
  <text x="60" y="46" font-family="'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="16" fill="#FFCD00">ID</text>

  <!-- ITALIANE small subtitle -->
  <text x="85" y="46" font-family="'Helvetica Neue', Arial, sans-serif"
        font-weight="500" font-size="9" fill="rgba(255,255,255,0.55)"> ITALIANE</text>
</svg>
